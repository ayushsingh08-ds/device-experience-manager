name: DEM CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: dem_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Prisma Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/dem_test_db?schema=public"
        run: npx prisma migrate deploy

      - name: Run Backend Integration Tests
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/dem_test_db?schema=public"
          JWT_SECRET: "ci-test-jwt-secret-key-12345"
        run: npm test

      - name: Build Backend (TypeScript Compilation)
        working-directory: ./backend
        run: npm run build

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend (Vite Production Bundle)
        working-directory: ./frontend
        run: npm run build

