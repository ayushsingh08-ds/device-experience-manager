version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dem-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: dem_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dem-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dem-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword2026@db:5432/dem_db?schema=public"
      JWT_SECRET: "super-secret-dem-jwt-key-change-in-production-2026"
      JWT_EXPIRES_IN: "7d"
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - dem-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dem-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dem-net

volumes:
  pgdata:

networks:
  dem-net:
    driver: bridge
